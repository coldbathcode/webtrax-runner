# The runner image on GitHub Container Registry, for linux/amd64 and
# linux/arm64: ghcr.io/coldbathcode/webtrax-runner.
#
# Before anything is pushed, the exact amd64 build is proven
# (scripts/image-test.sh: version, non-root, read-only root, same findings as
# the CLI outside) and scanned with Trivy (fails on a fixable critical or high
# vulnerability). On a version tag (v0.1.2 …) both platforms are pushed with an
# SBOM and SLSA provenance attached, and the digest is signed with cosign
# (keyless: the signature names this workflow and the tag). Run it by hand for
# a dry run: everything but the push and the signature.
#
# Verify a published image:
#   cosign verify ghcr.io/coldbathcode/webtrax-runner:<version> \
#     --certificate-identity-regexp '^https://github.com/coldbathcode/webtrax-runner/\.github/workflows/image\.yml@refs/tags/v' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
name: Image
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
  id-token: write
env:
  IMAGE: ghcr.io/coldbathcode/webtrax-runner
  PUBLISH: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: "Guard: a tag matches the CLI's version"
        id: version
        run: |
          version=$(node -p 'require("./packages/cli/package.json").version')
          if [ "$PUBLISH" = true ] && [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match @webtrax/cli $version"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: scripts/image.sh --pack-only
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      # Prove the amd64 build before anything leaves this job.
      - name: Build (amd64, for the checks)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: webtrax-runner:check
          cache-to: type=gha,mode=max
      # For the comparison run outside the image.
      - run: pnpm --filter @webtrax/net-proxy exec playwright-core install --with-deps chromium
      - run: scripts/image-test.sh webtrax-runner:check
      - name: Trivy (fixable critical and high vulnerabilities fail)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: webtrax-runner:check
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          format: table

      - name: Tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=v${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ steps.version.outputs.version }}
            type=semver,pattern={{major}},value=v${{ steps.version.outputs.version }}
            type=raw,value=latest
      - name: Sign in to GitHub Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build both platforms (pushed on a tag), with SBOM and provenance
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
      - uses: sigstore/cosign-installer@v4
        if: env.PUBLISH == 'true'
      - name: Sign the digest (keyless) and check the signature
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE@$DIGEST"
          cosign verify "$IMAGE@$DIGEST" \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/image.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          echo "signed $IMAGE@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
