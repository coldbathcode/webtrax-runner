# Publishes @webtrax/cli to npm when a version tag (v0.1.0 …) is pushed, with
# npm provenance, then moves the major tag the GitHub Action is used by
# (`action@v0` while 0.x) and creates the GitHub release. Guarded: refuses while packages/cli is still marked private
# (it stays private until the founder approves the alpha release, C05.9), and
# when the tag does not match the CLI's version. Publishes with npm trusted
# publishing (OIDC from this workflow, configured for @webtrax/cli on
# npmjs.com): no npm token is stored anywhere. Needs npm 11.5.1 or later.
name: Release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: write
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          # No registry-url: it writes an .npmrc with a placeholder token, and npm
          # then sends that instead of exchanging the OIDC token (E404 on publish).
      - run: pnpm install --frozen-lockfile
      - name: "Guard: the CLI is public and the tag matches its version"
        run: |
          node -e '
            const p = require("./packages/cli/package.json")
            const tag = process.env.GITHUB_REF_NAME.replace(/^v/, "")
            if (p.private) { console.error("packages/cli is still private: not approved for publishing"); process.exit(1) }
            if (p.version !== tag) { console.error(`tag ${tag} does not match @webtrax/cli ${p.version}`); process.exit(1) }
          '
      - run: pnpm --filter @webtrax/net-proxy exec playwright-core install --with-deps chromium
      - run: pnpm --filter @webtrax/net-proxy exec playwright-core install --with-deps webkit firefox
      - run: pnpm run check
      - run: pnpm run build
      - name: npm with trusted publishing (11.5.1 or later)
        run: npm install -g npm@^11.5.1 && npm --version
      - name: Publish @webtrax/cli
        working-directory: packages/cli
        run: npm publish --access public --provenance --loglevel verbose
      - name: Move the major tag (action@v0, action@v1 …)
        run: |
          major="v${GITHUB_REF_NAME#v}"; major="${major%%.*}"
          git tag -f "$major" "$GITHUB_SHA"
          git push -f origin "refs/tags/$major"
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "Webtrax runner $GITHUB_REF_NAME"
